@if (!compact) {
  <!-- Full view (standalone page) -->
  <div class="container mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-2xl font-bold text-slate-900">Medication Calendar</h2>
          <p class="mt-1 text-sm text-slate-600">View your medication schedule</p>
        </div>
        <button
          routerLink="/medications/new"
          class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors flex items-center gap-2 shadow-md hover:shadow-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Add Medication
        </button>
      </div>

      <div class="calendar-container">
        <full-calendar [options]="calendarOptions()"></full-calendar>
      </div>
    </div>
  </div>
} @else {
  <!-- Compact view (embedded in dashboard) -->
  <div class="calendar-container">
    <full-calendar [options]="calendarOptions()"></full-calendar>
  </div>
}
