<div class="space-y-6 max-w-4xl mx-auto">
  <!-- Welcome Section -->
  <div class="grid justify-center items-center">
      <h1 class="text-2xl font-bold text-slate-800">Dashboard</h1>
      <div *ngIf="currentUser">
        <p class="text-slate-500">Welcome back, <span class="font-semibold text-emerald-600">{{ currentUser.username }}</span>!</p>
      </div>
      <div *ngIf="!currentUser" class="animate-pulse h-4 w-32 bg-slate-200 rounded mt-1"></div>
  </div>
 <!-- Medication Schedule or Add Button -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-emerald-500">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        Medication Schedule
      </h2>

      @if (medicationsLoading) {
        <!-- Loading State -->
        <div class="flex justify-center items-center py-10">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600"></div>
        </div>
      } @else if (!hasMedications) {
        <!-- No Medications - Show Add Button -->
        <div class="text-center py-10 text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mx-auto mb-3 opacity-50">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 0 1-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 0 1 4.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0 1 12 15a9.065 9.065 0 0 0-6.23-.693L5 14.5m14.8.8 1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0 1 12 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" />
          </svg>
          <p class="text-sm">No medications added yet</p>
          <p class="text-xs text-slate-500 mt-1">Start tracking your medications</p>
          <button routerLink="/medications/new" class="mt-4 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition text-sm font-semibold shadow-md hover:shadow-lg">
            Add Medication
          </button>
        </div>
      } @else {
        <!-- Has Medications - Show Compact Calendar -->
        <div class="-mx-6 -mb-6">
          <app-medication-calendar [compact]="true"></app-medication-calendar>
        </div>
      }
    </div>
  <!-- BMI Chart Component -->
  <app-bmi-chart [userMetrics]="userMetrics"></app-bmi-chart>

  <!-- Vitals Chart Component -->
  <app-vitals-chart></app-vitals-chart>
</div>
