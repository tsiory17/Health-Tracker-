<div class="min-h-screen bg-slate-50 flex font-sans">
  <!-- Mobile Header with Hamburger Menu -->
  <header *ngIf="showNavbar" class="lg:hidden fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-lg flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
        </svg>
      </div>
      <h1 class="text-lg font-bold text-gray-900">Health Tracker</h1>
    </div>
    <button (click)="toggleMobileSidebar()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 text-gray-700">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
  </header>

  <!-- Mobile Overlay -->
  <div *ngIf="showNavbar && mobileMenuOpen"
       (click)="toggleMobileSidebar()"
       class="lg:hidden fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity">
  </div>

  <!-- Navbar Component -->
  <app-navbar *ngIf="showSidebar" [mobileMenuOpen]="mobileMenuOpen" (closeMobileMenu)="closeMobileSidebar()"></app-navbar>

  <!-- Main Content -->
  <main [class.lg:ml-64]="showSidebar" [class.pt-16]="showNavbar" class="flex-1 transition-all duration-300 lg:pt-0">
    <div class="p-4 sm:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </div>

    <!-- Footer Component -->
    <app-footer *ngIf="showNavbar"></app-footer>
  </main>
</div>

<!-- Timezone Update Dialog -->
<app-timezone-update-dialog
  *ngIf="showTimezoneDialog"
  [currentTimezone]="currentTimezone"
  [detectedTimezone]="detectedTimezone"
  (updateTimezone)="updateTimezone()"
  (dismiss)="dismissTimezoneDialog()">
</app-timezone-update-dialog>

<!-- Medication Detail Modal - Rendered at App Root Level -->
<app-medication-detail-modal
  [medication]="selectedMedication"
  [isOpen]="showMedicationDetailModal"
  (closeModal)="closeMedicationDetailModal()">
</app-medication-detail-modal>
