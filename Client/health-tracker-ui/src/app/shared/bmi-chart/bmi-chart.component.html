<div *ngIf="userMetrics" class="rounded-2xl overflow-hidden">
  <!-- Header -->
  <div class="p-6 border-b border-slate-100 flex justify-between items-center">
    <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-emerald-500">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v17.25m0 0c-1.472 0-2.882.265-4.185.75M12 20.25c1.472 0 2.882.265 4.185.75M18.75 4.97A48.416 48.416 0 0 0 12 4.5c-2.291 0-4.545.16-6.75.47m13.5 0c1.01.143 2.01.317 3 .52m-3-.52 2.62 10.726c.122.499-.106 1.028-.589 1.202a5.988 5.988 0 0 1-2.031.352 5.994 5.994 0 0 1-2.029-.352c-.484-.174-.711-.703-.59-1.202L18.75 4.971Zm-16.5.52c.99-.203 1.99-.377 3-.52m0 0 2.62 10.726c.122.499-.106 1.028-.589 1.202a5.988 5.988 0 0 1-2.031.352 5.994 5.994 0 0 1-2.029-.352c-.484-.174-.711-.703-.59-1.202L5.25 4.971Z" />
      </svg>
      Body Mass Index
    </h2>
    <span class="px-3 py-1 rounded-full text-xs font-semibold"
          [ngClass]="{
            'bg-emerald-100 text-emerald-700': bmiCategory === 'Normal',
            'bg-yellow-100 text-yellow-700': bmiCategory === 'Underweight' || bmiCategory === 'Overweight',
            'bg-red-100 text-red-700': bmiCategory === 'Obese'
          }">
      {{ bmiCategory }}
    </span>
  </div>

  <!-- Body -->
  <div class="p-6">
    <div class="bg-slate-50 rounded-xl p-4 mb-6">
       <div class="grid grid-cols-2 gap-4 text-center">
         <div>
           <p class="text-xs text-slate-500 uppercase font-semibold tracking-wider">Height</p>
           <p class="text-xl font-bold text-slate-800">{{ userMetrics.heightCm }} <span class="text-sm font-normal text-slate-500">cm</span></p>
         </div>
         <div>
           <p class="text-xs text-slate-500 uppercase font-semibold tracking-wider">Weight</p>
           <p class="text-xl font-bold text-slate-800">{{ userMetrics.weightKg }} <span class="text-sm font-normal text-slate-500">kg</span></p>
         </div>
       </div>
    </div>

    <div class="h-64 relative w-full">
      <canvas #bmiChart></canvas>
    </div>

    <div class="mt-6 flex flex-wrap justify-center gap-3 text-xs text-slate-600">
       <div class="flex items-center gap-1.5">
         <div class="w-2 h-2 rounded-full bg-red-400"></div> Obese (≥30)
       </div>
       <div class="flex items-center gap-1.5">
         <div class="w-2 h-2 rounded-full bg-yellow-400"></div> Overweight (25-30)
       </div>
       <div class="flex items-center gap-1.5">
         <div class="w-2 h-2 rounded-full bg-emerald-500"></div> Normal (18.5-25)
       </div>
       <div class="flex items-center gap-1.5">
         <div class="w-2 h-2 rounded-full bg-yellow-400"></div> Underweight (<18.5)
       </div>
    </div>
  </div>
</div>
