<div class="space-y-6">
  <!-- Loading State -->
  <div *ngIf="loading" class="rounded-2xl p-6">
    <div class="flex justify-center items-center py-10">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600"></div>
    </div>
  </div>

  <!-- No Vitals State -->
  <div *ngIf="!loading && !hasVitals" class="rounded-2xl p-6">
    <div class="text-center py-10 text-slate-400">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mx-auto mb-3 opacity-50">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
      </svg>
      <p class="text-sm">No vitals recorded yet</p>
      <p class="text-xs text-slate-500 mt-1">Start tracking your health vitals</p>
      <button routerLink="/vitals/add" class="mt-4 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition text-sm font-semibold shadow-md hover:shadow-lg">
        Add Vital Signs
      </button>
    </div>
  </div>

  <!-- Vitals Charts -->
  <div *ngIf="!loading && hasVitals" class="space-y-6">
    <!-- Latest Vitals Summary -->
    <div class="rounded-2xl overflow-hidden">
      <div class="p-6 border-b border-slate-100">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-emerald-500">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
            </svg>
            Latest Vitals
          </h2>
          <button routerLink="/vitals/add" class="px-3 py-1 text-xs bg-emerald-50 text-emerald-700 rounded-lg hover:bg-emerald-100 transition font-semibold">
            + Add New
          </button>
        </div>
      </div>

      <div class="p-6">
        <div class="grid grid-cols-2 gap-4">
          <!-- Blood Pressure -->
          <div *ngIf="latestVital?.bloodPressureSystolic && latestVital?.bloodPressureDiastolic" class="bg-slate-50 rounded-xl p-4">
            <p class="text-xs text-slate-500 uppercase font-semibold tracking-wider mb-1">Blood Pressure</p>
            <p class="text-2xl font-bold text-slate-800">
              {{ latestVital?.bloodPressureSystolic }}/{{ latestVital?.bloodPressureDiastolic }}
              <span class="text-sm font-normal text-slate-500">mmHg</span>
            </p>
            <div class="flex items-center gap-2 mt-2 text-sm">
              <div class="w-3 h-3 rounded-full"
                   [ngClass]="{
                     'bg-emerald-500': getBloodPressureStatus() === 'green',
                     'bg-yellow-400': getBloodPressureStatus() === 'yellow',
                     'bg-red-500': getBloodPressureStatus() === 'red'
                   }">
              </div>
              <span class="text-slate-600">{{ getBloodPressureMessage() }}</span>
            </div>
          </div>

          <!-- Heart Rate -->
          <div *ngIf="latestVital?.heartRate" class="bg-slate-50 rounded-xl p-4">
            <p class="text-xs text-slate-500 uppercase font-semibold tracking-wider mb-1">Heart Rate</p>
            <p class="text-2xl font-bold text-slate-800">
              {{ latestVital?.heartRate }}
              <span class="text-sm font-normal text-slate-500">bpm</span>
            </p>
            <div class="flex items-center gap-2 mt-2 text-sm">
              <div class="w-3 h-3 rounded-full"
                   [ngClass]="{
                     'bg-emerald-500': getHeartRateStatus() === 'green',
                     'bg-yellow-400': getHeartRateStatus() === 'yellow',
                     'bg-red-500': getHeartRateStatus() === 'red'
                   }">
              </div>
              <span class="text-slate-600">{{ getHeartRateMessage() }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- History Charts -->
    <div *ngIf="hasBloodPressureData() || hasHeartRateData() || hasWeightData()" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Blood Pressure Chart -->
      <div *ngIf="hasBloodPressureData()" class="rounded-xl p-6">
        <div style="height: 300px;">
          <canvas #bloodPressureChart></canvas>
        </div>
      </div>

      <!-- Heart Rate Chart -->
      <div *ngIf="hasHeartRateData()" class="rounded-xl p-6">
        <div style="height: 300px;">
          <canvas #heartRateChart></canvas>
        </div>
      </div>

      <!-- Weight Chart -->
      <div *ngIf="hasWeightData()" class="rounded-xl p-6">
        <div style="height: 300px;">
          <canvas #weightChart></canvas>
        </div>
      </div>
    </div>

  </div>
</div>
