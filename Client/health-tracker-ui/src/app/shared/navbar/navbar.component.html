<aside *ngIf="showSidebar" class="w-64 bg-emerald-700 text-white flex flex-col fixed h-full shadow-xl z-20 transition-all duration-300">
  <!-- Logo -->
  <div class="p-6 border-b border-emerald-600 flex items-center gap-3">
    <div class="bg-white p-2 rounded-lg bg-opacity-20 backdrop-blur-sm">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-white">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
      </svg>
    </div>
    <div>
      <h1 class="text-xl font-bold tracking-tight">HealthTrack</h1>
      <p class="text-xs text-emerald-200">Your Health Companion</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 space-y-2">
    <a *ngFor="let item of navItems"
       [routerLink]="item.route"
       routerLinkActive="bg-emerald-600 shadow-md"
       class="flex items-center gap-3 px-4 py-3 rounded-xl text-emerald-50 hover:bg-emerald-600/50 transition-all duration-200 group"
       [title]="item.description">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 group-hover:scale-110 transition-transform">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.svgPath" />
      </svg>
      <span class="font-medium">{{ item.label }}</span>
    </a>
  </nav>

  <!-- User Profile / Logout -->
  <div class="p-4 border-t border-emerald-600">
    <button (click)="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-emerald-800 transition-colors text-emerald-100">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25" />
      </svg>
      <span class="font-medium">Logout</span>
    </button>
  </div>
</aside>
